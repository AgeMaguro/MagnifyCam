plugins { id 'com.android.application' }

android {
    namespace 'com.agemaguro.magnifycam'
    compileSdk 34

    defaultConfig {
        applicationId 'com.agemaguro.magnifycam'
        minSdk 29
        targetSdk 34
        versionCode((project.findProperty('vc') ?: '1').toInteger())
        versionName "1.0." + (project.findProperty('vc') ?: '1')
    }
    signingConfigs {
        // Shared debug-style key (public password "android") so every build can update the last one.
        shared {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        // A lint warning must never stop the APK from building.
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Some AndroidX libraries pull in two different Kotlin runtimes; this pins them to one version.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    def camerax = '1.3.4'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-core:2.6.2'
    implementation 'com.google.guava:listenablefuture:1.0'
}
